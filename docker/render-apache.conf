<IfModule mpm_prefork_module>
    # Keep Apache within Render Free's 512 MB container while the Laravel
    # product-file queue worker is running in the same service.
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 3
    MaxConnectionsPerChild 100
</IfModule>

<VirtualHost *:10000>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
